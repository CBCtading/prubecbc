<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Sistema CBC</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3a0ca3;
            --accent: #4895ef;
            --dark: #14213d;
            --light: #f8f9fa;
            --success: #4cc9f0;
            --danger: #f72585;
            --warning: #f8961e;
            --cbc: #7209b7;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--dark);
        }
        
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 2.5rem;
            border-radius: 15px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .logo i {
            font-size: 3.5rem;
            color: var(--cbc);
            margin-bottom: 1rem;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .logo h1 {
            color: var(--dark);
            font-weight: 600;
            font-size: 1.8rem;
            background: linear-gradient(to right, var(--primary), var(--cbc));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--dark);
        }
        
        .form-control {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.5rem;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s;
            background-color: #f8f9fa;
        }
        
        .input-icon {
            position: absolute;
            left: 1rem;
            top: 2.6rem;
            color: var(--primary);
        }
        
        .btn {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .btn-primary {
            background-color: var(--primary);
            color: white;
        }
        
        .btn-primary:hover {
            background-color: var(--secondary);
            transform: translateY(-2px);
        }
        
        .btn-google {
            background-color: white;
            color: #4285F4;
            border: 1px solid #ddd;
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: #6c757d;
        }
        
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid #dee2e6;
        }
        
        .alert {
            padding: 0.8rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <i class="fas fa-coins"></i>
            <h1>Sistema CBC</h1>
        </div>
        
        <div id="errorMessage" class="alert alert-danger" style="display: none;"></div>
        <div id="successMessage" class="alert alert-success" style="display: none;"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <i class="fas fa-envelope input-icon"></i>
                <input type="email" id="email" class="form-control" placeholder="correo@ejemplo.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
            </button>
        </form>
        
        <div class="divider">o</div>
        
        <button id="googleLogin" class="btn btn-google">
            <img src="BackgroundEraser_20250501_075623399.png" width="20" alt="Google logo">
            Continuar con Google
        </button>
        
        <p class="footer-text" style="text-align: center; margin-top: 1.5rem; color: #6c757d;">
            ¿No tienes cuenta? <a href="#" id="registerLink" style="color: var(--primary); text-decoration: none; font-weight: 500;">Regístrate aquí</a>
        </p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB3_jgunEavIbXhDfNa89giXITKqA8k22o",
            authDomain: "sistema-51efc.firebaseapp.com",
            projectId: "sistema-51efc",
            storageBucket: "sistema-51efc.firebasestorage.app",
            messagingSenderId: "950545396950",
            appId: "1:950545396950:web:cff9ec4eb6b76516df0577",
            measurementId: "G-3L0ST3XP6B"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        document.getElementById('registerLink').addEventListener('click', (e) => {
            e.preventDefault();
            const email = prompt("Ingresa tu correo electrónico:");
            if (!email) return;
            
            const password = prompt("Ingresa una contraseña (mínimo 6 caracteres):");
            if (!password || password.length < 6) {
                alert("La contraseña debe tener al menos 6 caracteres");
                return;
            }
            
            auth.createUserWithEmailAndPassword(email, password)
                .then(async (userCredential) => {
                    await db.collection('users').doc(userCredential.user.uid).set({
                        email: email,
                        balance: 0,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        role: 'user'
                    });
                    showMessage('success', '¡Registro exitoso! Ahora puedes iniciar sesión.');
                })
                .catch((error) => {
                    showMessage('error', error.message);
                });
        });

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    redirectUser(userCredential.user);
                })
                .catch((error) => {
                    showMessage('error', error.message);
                });
        });

        document.getElementById('googleLogin').addEventListener('click', () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then(async (userCredential) => {
                    if (userCredential.additionalUserInfo?.isNewUser) {
                        await db.collection('users').doc(userCredential.user.uid).set({
                            email: userCredential.user.email,
                            balance: 0,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                            role: 'user'
                        });
                    }
                    redirectUser(userCredential.user);
                })
                .catch((error) => {
                    showMessage('error', error.message);
                });
        });

        function redirectUser(user) {
            db.collection('users').doc(user.uid).get()
                .then((doc) => {
                    if (doc.exists) {
                        const userData = doc.data();
                        if (user.email === 'orelemcc17@gmail.com' || userData.role === 'admin') {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = 'usuario.html';
                        }
                    } else {
                        db.collection('users').doc(user.uid).set({
                            email: user.email,
                            balance: 0,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                            role: 'user'
                        }).then(() => {
                            window.location.href = 'usuario.html';
                        });
                    }
                });
        }

        function showMessage(type, message) {
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            
            if (type === 'error') {
                errorDiv.textContent = message;
                errorDiv.style.display = 'flex';
                successDiv.style.display = 'none';
            } else {
                successDiv.textContent = message;
                successDiv.style.display = 'flex';
                errorDiv.style.display = 'none';
            }
            
            setTimeout(() => {
                errorDiv.style.display = 'none';
                successDiv.style.display = 'none';
            }, 5000);
        }

        auth.onAuthStateChanged((user) => {
            if (user) {
                redirectUser(user);
            }
        });
    </script>
</body>
</html>
